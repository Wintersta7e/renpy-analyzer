name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]" pyinstaller

      - name: Build executable
        run: python -m PyInstaller renpy_analyzer.spec --clean --noconfirm

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:TAG_NAME -replace '^v',''
          gh release create $env:TAG_NAME `
            "dist/RenpyAnalyzer.exe" `
            --title "Ren'Py Analyzer v${version}" `
            --generate-notes

      # Retention policy: keep only the 2 newest stable releases visible.
      # Prereleases and drafts are not counted and not deleted. Git tags are
      # preserved (only the Release object + its uploaded assets are removed),
      # so `git describe` and commit archaeology continue to work.
      #
      # All inputs in this step come from GitHub's API via `gh release list`,
      # not from untrusted event payloads, so there is no injection surface.
      - name: Trim old releases (keep 2 newest stable)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $to_delete = gh release list --limit 100 `
            --json tagName,publishedAt,isDraft,isPrerelease `
            --jq "[.[] | select(.isDraft==false and .isPrerelease==false)] | sort_by(.publishedAt) | reverse | .[2:] | .[].tagName"
          if (-not $to_delete) {
            Write-Host "No stable releases to trim."
            exit 0
          }
          foreach ($tag in $to_delete -split "`n") {
            $tag = $tag.Trim()
            if ($tag) {
              Write-Host "Deleting release $tag (git tag preserved)"
              gh release delete $tag --yes
            }
          }
